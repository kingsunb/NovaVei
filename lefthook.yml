# NovaVeil web-next Pre-commit Hook
#  - 在 commit 前跑 typecheck + lint
#  - 不跑 test / build / e2e（这些在 CI 跑，太慢）
#  - 安装：pnpm dlx lefthook install
min_version: 1.6.0

pre-commit:
  parallel: false
  commands:
    web-next-typecheck:
      root: web-next
      glob: "web-next/src/**/*.{ts,tsx}"
      run: pnpm typecheck
    web-next-lint:
      root: web-next
      glob: "web-next/src/**/*.{ts,tsx}"
      run: pnpm lint
